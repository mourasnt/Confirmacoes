version: '3.8'

services:
  whatsapp-confirmacoes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-confirmacoes
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Evolution API Configuration
      EVOLUTION_API_URL: "http://evolution_api:8080"
      EVOLUTION_API_KEY: "Senh@Segura123"
      
      # Flask Configuration
      FLASK_ENV: "production"
      FLASK_APP: "app.py"
      PYTHONUNBUFFERED: "1"
    
    volumes:
      # Mount data directory for persistent database
      - ./data:/app/data
      # Mount templates for easy configuration
      - ./templates:/app/templates
      # Mount static files
      - ./static:/app/static
      # Mount credentials for Google Sheets
      - ./credentials.json:/app/credentials.json:ro
    
    depends_on:
      - evolution-api
    
    networks:
      - whatsapp-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Evolution API service (commented out - configure to your environment)
  # Uncomment and configure if you want to run Evolution API in the same compose
  # evolution-api:
  #   image: atendai/evolution-api:latest
  #   container_name: evolution-api
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     # Configure as needed for your environment
  #     EVOLUTION_API_PORT: "8080"
  #   volumes:
  #     - evolution-data:/home/evolution/instances
  #   networks:
  #     - whatsapp-network

networks:
  whatsapp-network:
    driver: bridge

