{% extends "base.html" %}

{% block title %}Conectar Instância{% endblock %}

{% block content %}
<div class="card" style="max-width:450px; margin:auto;">
    <div class="card-body" style="padding: 2rem;"> <h2 class="text-center" style="font-weight: 700; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--gray-200);">
            <i class="bi bi-qr-code-scan" style="color: var(--primary);"></i>
            Conectar Instância
        </h2>

        <label for="numero">Digite o DDD + número (somente números):</label>
        <input type="text" id="numero" class="form-control-lg" placeholder="11969231989">

        <button onclick="validarNumero()" class="btn btn-primary btn-lg w-100 mt-3">Avançar</button>

        <div id="instancia_nome_group">
            <label for="instancia_nome">Nome da nova instância:</label>
            <input type="text" id="instancia_nome" class="form-control-lg" placeholder="Ex: Spots">
            <button onclick="gerarQRCode()" class="btn btn-success btn-lg w-100 mt-3">Gerar QR Code</button>
        </div>

        <img id="qrcode_img">
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Passa as instâncias para JS
    const INSTANCIAS = {{ instancias|tojson }};
    let instancia_selecionada = null;

    // Limpa tudo que não é número e força +55 antes de enviar
    function somenteNumeros(str) {
        return str.replace(/\D/g, "");
    }

    function validarNumero() {
        let num = document.getElementById("numero").value.trim();
        num = somenteNumeros(num);

        if (num.length < 10) {
            alert("Número inválido!");
            return;
        }

        // força adicionar +55
        num = "55" + num;

        // tenta localizar nas instâncias
        instancia_selecionada = INSTANCIAS.find(i => {
            const limpo = somenteNumeros(i.number || "");
            return limpo === String(num);
        });

        if (instancia_selecionada) {
            // já temos instância → gerar QR Code direto
            gerarQRCode(instancia_name=instancia_selecionada.name);
        } else {
            // pedir nome da instância
            document.getElementById("instancia_nome_group").style.display = "block";
            alert("Número não encontrado. Informe o nome da instância.");
        }
    }

    async function criar_instancia(instancia_name, numero) {
        try {
            const payload = {
                instancia: instancia_name,
                numero: numero
            };

            const resp = await fetch("/whatsapp/api/criar-instancia", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await resp.json();

            if (!data.success) {
                alert("Erro ao criar instância: " + data.error);
                return false;
            }

            return true;

        } catch (e) {
            alert("Erro ao chamar API: " + e);
            return false;
        }

    }

    async function gerarQRCode(instancia_name=null) {
        let instancia = "";

        if (instancia_selecionada) {
            instancia = instancia_selecionada.name;
        } else {
            if (!instancia_name) {
                instancia_name = document.getElementById("instancia_nome").value.trim();
            }
            if (!instancia_name) {
                alert("Digite o nome da instância!");
                return;
            }
            const numero = "55"+somenteNumeros(document.getElementById("numero").value.trim());

            await criar_instancia(instancia_name, numero);

        }

        const payload = { instancia: instancia_name };

        try {
            const resp = await fetch("/whatsapp/api/get-qrcode", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await resp.json();

            if (!data.success) {
                alert("Erro: " + data.error);
                return;
            }

            const qr_img = document.getElementById("qrcode_img");
            // limpa para evitar cache interno do navegador
            qr_img.style.display = "none";
            qr_img.src = "";  

            // pequeno delay garante que o browser processe a limpeza
            setTimeout(() => {
                qr_img.src = data.qrcode; // novo base64
                qr_img.style.display = "block";
            }, 50);

        } catch (e) {
            alert("Erro ao chamar API: " + e);
        }
    }
</script>
{% endblock %}
