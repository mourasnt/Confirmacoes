<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Confirmações WhatsApp{% endblock %}</title>

    <!-- Icone -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0066cc;
            --success: #25d366;
            --warning: #ffa500;
            --danger: #dc3545;
            --info: #17a2b8;
            --gray-50: #f8f9fa;
            --gray-200: #e9ecef;
            --gray-700: #343a40;
            --gray-800: #212529;
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --border-radius: 8px;
            --border-radius-lg: 12px;
        }
        
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1050;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.2rem 0;
        }
        body {
            padding-top: 80px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-bottom: 30px;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: var(--gray-800);
        }
        
        .navbar-brand {
            font-weight: 700;
            color: white !important;
            text-decoration: none;
        }
        
        .nav-link {
            color: rgb(68, 68, 68);
            font-weight: 500;
            margin: 0 0.25rem;
            padding: 0.5rem 1rem !important;
            border-radius: var(--border-radius);
            transition: all 0.3s;
        }
        
        .nav-link:hover {
            color: white;
            background: linear-gradient(135deg, #667eea80 0%, #764ba280 100%);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: var(--shadow-md);
        }
        
        .card {
            border: none;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            background: white;
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-2px);
        }
        
        .card-header {
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
            padding: 1.25rem 1.5rem;
            font-weight: 600;
            color: var(--gray-700);
            display: flex;
            align-items: center;
        }
        
        .card-header i {
            margin-right: 0.5rem;
            color: var(--primary);
        }
        
        .btn {
            font-weight: 500;
            border-radius: var(--border-radius);
            padding: 0.625rem 1.25rem;
            border: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn:hover {
            transform: translateY(-1px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #25d366 0%, #20c55a 100%);
        }
        
        .table-container {
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            background: white;
        }
        
        .table thead th {
            background: var(--gray-50);
            border: none;
            font-weight: 600;
            padding: 1rem;
        }
        
        .table tbody td {
            padding: 1rem;
            vertical-align: middle;
        }
        
        .table tbody tr:hover {
            background: var(--gray-50);
        }
        
        .badge {
            padding: 0.5rem 0.75rem;
            border-radius: var(--border-radius);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .status-enviado {
            background: rgba(37, 211, 102, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }
        
        .status-pendente {
            background: rgba(255, 165, 0, 0.1);
            color: var(--warning);
            border: 1px solid var(--warning);
        }
        
        .stats-card {
            background: white;
            border-radius: var(--border-radius-lg);
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
            border-left: 4px solid var(--primary);
        }
        
        .stats-card:hover {
            transform: translateY(-2px);
        }
        
        .stats-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        
        .stats-label {
            color: var(--gray-700);
            font-weight: 500;
            font-size: 0.875rem;
        }
        
        .alert {
            border: none;
            border-radius: var(--border-radius-lg);
            padding: 1rem 1.5rem;
            border-left: 4px solid;
        }
        
        .alert-success {
            background: rgba(37, 211, 102, 0.1);
            border-color: var(--success);
            color: var(--success);
        }
        
        .alert-danger {
            background: rgba(220, 53, 69, 0.1);
            border-color: var(--danger);
            color: var(--danger);
        }
        
        .alert-warning {
            background: rgba(255, 165, 0, 0.1);
            border-color: var(--warning);
            color: var(--warning);
        }
        
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }

        label {
            display: block;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
            margin-top: 1rem;
        }

        input[type="text"].form-control-lg {
            width: 100%;
            padding: 0.875rem 1rem; /* 14px 16px */
            border-radius: var(--border-radius);
            border: 1px solid var(--gray-200);
            font-size: 1rem;
            color: var(--gray-800);
            background: var(--gray-50);
            transition: all 0.3s ease;
            box-sizing: border-box; /* Garante que padding não quebre o layout */
        }

        input[type="text"].form-control-lg:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
        }

        #instancia_nome_group {
            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--gray-200);
        }

        #qrcode_img {
            margin-top: 1.5rem;
            display: none;
            width: 100%;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--gray-200);
        }

        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="3ZX - Confirmações" style="height: 56px; vertical-align: middle;">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{{ url_for('index') }}">
                        <i class="bi bi-house"></i> Início
                    </a>
                    <a class="nav-link" href="{{ url_for('conectar_instancia') }}">
                        <i class="bi bi-qr-code-scan"></i> Conectar
                    </a>
                    <a class="nav-link" href="{{ url_for('listar_templates') }}">
                        <i class="bi bi-file-text"></i> Templates
                    </a>
                    <a class="nav-link" href="{{ url_for('historico') }}">
                        <i class="bi bi-clock-history"></i> Histórico
                    </a>
                    <a class="nav-link" href="{{ url_for('config') }}">
                        <i class="bi bi-gear"></i> Configurações
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4 fade-in-up">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' if category == 'success' else 'warning' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        carregarTemplates();
        atualizarContadorSelecionados();
        
        document.querySelectorAll('.card, .stats-card').forEach((element, index) => {
            element.style.animationDelay = `${index * 0.1}s`;
            element.classList.add('fade-in-up');
        });
    });
    
    async function carregarTemplates() {
        try {
            const response = await fetch('/whatsapp/api/templates');
            const data = await response.json();
            
            const selectTemplate = document.getElementById('template-select');
            if (selectTemplate) {
                selectTemplate.innerHTML = '<option value="">Selecione um template...</option>';
                
                if (data.success && data.templates) {
                    data.templates.forEach(template => {
                        const option = document.createElement('option');
                        option.value = template.id;
                        option.textContent = template.nome;
                        selectTemplate.appendChild(option);
                    });
                }
            }
        } catch (error) {
            console.error('Erro ao carregar templates:', error);
            const selectTemplate = document.getElementById('template-select');
            if (selectTemplate) {
                selectTemplate.innerHTML = '<option value="">Erro ao carregar templates</option>';
            }
        }
    }
    
    async function aplicarTemplate() {
        const selectTemplate = document.getElementById('template-select');
        const textareaTemplate = document.getElementById('template');
        
        if (!selectTemplate || !textareaTemplate) return;
        
        const templateId = selectTemplate.value;
        if (!templateId) return;
        
        try {
            const response = await fetch(`/whatsapp/api/templates/${templateId}`);
            const data = await response.json();
            
            if (data.success) {
                textareaTemplate.value = data.conteudo;
            } else {
                console.error('Erro ao carregar template:', data.error);
            }
        } catch (error) {
            console.error('Erro ao aplicar template:', error);
        }
    }
    
    function selecionarTodos() {
        const checkboxTodos = document.getElementById('selecionar-todos');
        const checkboxes = document.querySelectorAll('input[name="ids_selecionados"]:not([disabled])');
        
        checkboxes.forEach(checkbox => {
            checkbox.checked = checkboxTodos.checked;
        });
        
        atualizarBotaoEnvio();
        atualizarContadorSelecionados();
    }
    
    function atualizarBotaoEnvio() {
        const checkboxes = document.querySelectorAll('input[name="ids_selecionados"]:checked');
        const btnEnviar = document.getElementById('btn-enviar');
        
        if (btnEnviar) {
            if (checkboxes.length > 0) {
                btnEnviar.disabled = false;
                btnEnviar.innerHTML = `<i class="bi bi-send"></i> Enviar (${checkboxes.length})`;
                btnEnviar.className = 'btn btn-success btn-lg';
            } else {
                btnEnviar.disabled = true;
                btnEnviar.innerHTML = '<i class="bi bi-send"></i> Selecione registros';
                btnEnviar.className = 'btn btn-outline-primary btn-lg';
            }
        }
    }
    
    function atualizarContadorSelecionados() {
        const checkboxes = document.querySelectorAll('input[name="ids_selecionados"]:checked');
        const contador = document.getElementById('contador-selecionados');
        
        if (contador) {
            contador.textContent = checkboxes.length;
        }
    }
    
    document.addEventListener('change', function(e) {
        if (e.target.name === 'ids_selecionados') {
            atualizarBotaoEnvio();
            atualizarContadorSelecionados();
        }
    });
    
    document.addEventListener('submit', function(e) {
        const submitBtn = e.target.querySelector('button[type="submit"]');
        if (submitBtn) {
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processando...';
            submitBtn.disabled = true;
        }
    });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
